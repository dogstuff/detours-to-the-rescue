---
image: docker.io/nixos/nix:2.24.11

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  CI_NIX_PROFILE_DIR: ".nix-profiles"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dttr/${CI_COMMIT_TAG}"
  DTTR_REQUIRE_TEST_DEPS: "ON"
  DTTR_REQUIRE_PCDOGS_FIXTURES: "ON"
  DTTR_PCDOGS_FIXTURE_DIR: "gamefiles"
  DTTR_GAMEFILES_SECURE_FILE: "gamefiles.tar.gz"
  DTTR_USE_CACHED_SDL3GPU_SHADERS: "ON"

.nix-cache:
  before_script:
    - |
      export CI_NIX_PROFILE="${CI_PROJECT_DIR}/${CI_NIX_PROFILE_DIR}/${CI_JOB_NAME_SLUG}"
      mkdir -p "$(dirname "$CI_NIX_PROFILE")"
      if [ "${CI_NIX_PACKAGE_CACHE_RESTORE:-false}" = "true" ]; then
        scripts/ci-nix-package-cache.sh restore || true
      fi
      if [ -d .nix-cache ]; then
        echo "Restoring package registry Nix cache..."
        nix copy --all --from "file://${CI_PROJECT_DIR}/.nix-cache" --no-check-sigs || true
      fi
      echo "Realizing CI Nix profile for ${CI_NIX_SHELL} with cache key ${CI_NIX_CACHE_KEY}..."
      nix develop --profile "$CI_NIX_PROFILE" "$CI_NIX_SHELL" --command true
  after_script:
    - |
      export CI_NIX_PROFILE="${CI_PROJECT_DIR}/${CI_NIX_PROFILE_DIR}/${CI_JOB_NAME_SLUG}"
      if [ "${CI_NIX_PACKAGE_CACHE_SAVE:-false}" = "true" ] && [ "${CI_JOB_STATUS}" = "success" ] && [ -e "$CI_NIX_PROFILE" ]; then
        echo "Saving CI Nix profile closure to package registry cache..."
        mkdir -p .nix-cache
        nix copy --to "file://${CI_PROJECT_DIR}/.nix-cache" "$(readlink -f "$CI_NIX_PROFILE")"
        scripts/ci-nix-package-cache.sh save || true
      else
        echo "Skipping package registry cache save (status=${CI_JOB_STATUS}, save=${CI_NIX_PACKAGE_CACHE_SAVE:-false})."
      fi

.ci-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

.build-job:
  extends:
    - .nix-cache
    - .ci-rules
  stage: build
  needs:
    - job: "prepare:shaders"
      artifacts: true

.package-build-job:
  extends: .build-job
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-package"
    CI_NIX_CACHE_KEY: "ci-package"

.upload-job:
  extends:
    - .nix-cache
  stage: package
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-upload"
    CI_NIX_CACHE_KEY: "ci-upload"

stages:
  - prepare
  - build
  - test
  - package
  - deploy
  - release

"prepare:shaders":
  extends:
    - .nix-cache
  stage: prepare
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-shaders"
    CI_NIX_CACHE_KEY: "ci-shaders"
    CI_NIX_PACKAGE_CACHE_RESTORE: "true"
    CI_NIX_PACKAGE_CACHE_SAVE: "false"
  script:
    - nix develop "$CI_NIX_SHELL" --command just ci-shader-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        CI_NIX_PACKAGE_CACHE_SAVE: "true"
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        CI_NIX_PACKAGE_CACHE_SAVE: "true"
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - modules/sidecar/shaders/cache/sdl3gpu/
    expire_in: 1 day

"build:ctest":
  extends: .build-job
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-build"
    CI_NIX_CACHE_KEY: "ci-build"
  script:
    - nix develop "$CI_NIX_SHELL" --command just ci-build-ctest
  artifacts:
    paths:
      - build/
    expire_in: 1 day

"build:debug":
  extends: .package-build-job
  script:
    - |
      package_registry_url=""
      job_token=""
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        package_registry_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dttr/${CI_COMMIT_REF_SLUG}"
        job_token="${CI_JOB_TOKEN}"
      fi
      nix develop "$CI_NIX_SHELL" --command \
        just package-debug \
        "${CI_COMMIT_TAG:-dev}" \
        "${CI_COMMIT_REF_SLUG}" \
        "$package_registry_url" \
        "$job_token"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-modding-*-debug.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

"build:release":
  extends: .package-build-job
  script:
    - nix develop "$CI_NIX_SHELL" --command just package-release "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-*-release.zip
      - dttr-modding-*-debug.zip
      - dttr-modding-*-release.zip
      - dttr-mod-template-c.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

"test:ctest":
  extends:
    - .nix-cache
    - .ci-rules
  stage: test
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-test"
    CI_NIX_CACHE_KEY: "ci-test"
  needs:
    - job: "build:ctest"
      artifacts: true
  script:
    - nix develop "$CI_NIX_SHELL" --command bash -lc 'scripts/fetch-ci-gamefiles.sh && just ci-test'
  artifacts:
    when: always
    paths:
      - build/Testing/Temporary/LastTest.log
    expire_in: 2 weeks

"test:docs":
  extends:
    - .nix-cache
  stage: test
  variables:
    CI_NIX_SHELL: ".#devShells.x86_64-linux.ci-docs"
    CI_NIX_CACHE_KEY: "ci-docs"
  needs:
    - job: "build:ctest"
      artifacts: true
  script:
    - nix develop "$CI_NIX_SHELL" --command just build-docs-from-build
  artifacts:
    paths:
      - docs/build
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

"package:release":
  extends: .upload-job
  needs:
    - job: "build:release"
      artifacts: true
  script:
    - >-
      nix develop "$CI_NIX_SHELL" --command
      scripts/upload-package-artifacts.sh
      "${PACKAGE_REGISTRY_URL}"
      "${CI_JOB_TOKEN}"
      "dttr-${CI_COMMIT_TAG}-debug.zip"
      "dttr-${CI_COMMIT_TAG}-release.zip"
      "dttr-modding-${CI_COMMIT_TAG}-debug.zip"
      "dttr-modding-${CI_COMMIT_TAG}-release.zip"
      "dttr-mod-template-c.zip"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-*-release.zip
      - dttr-modding-*-debug.zip
      - dttr-modding-*-release.zip
      - dttr-mod-template-c.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

.pages-deploy-job: &pages-deploy-job
  stage: deploy
  needs:
    - job: "test:docs"
      artifacts: true
  script:
    - test -d docs/build
  pages: &pages-settings
    publish: docs/build
    expire_in: never
  artifacts:
    paths:
      - docs/build

"deploy:pages:latest":
  <<: *pages-deploy-job
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$/'

"release:gitlab":
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - scripts/generate-release-notes.sh > changelog.md
  needs:
    - job: "package:release"
      artifacts: false
  release:
    tag_name: $CI_COMMIT_TAG
    description: ./changelog.md
    assets:
      links:
        - name: "dttr-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-release.zip"
          link_type: package
        - name: "dttr-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-modding-release.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
        - name: "dttr-mod-template-c.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-mod-template-c.zip"
          filepath: "/dttr-mod-template-c.zip"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
