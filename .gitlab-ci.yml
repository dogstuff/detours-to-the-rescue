---
image: docker.io/nixos/nix:2.24.11

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dttr/${CI_COMMIT_TAG}"
  DTTR_REQUIRE_TEST_DEPS: "ON"
  DTTR_REQUIRE_PCDOGS_FIXTURES: "ON"
  DTTR_PCDOGS_FIXTURE_DIR: "gamefiles"
  DTTR_GAMEFILES_SECURE_FILE: "gamefiles.tar.gz"

.nix-cache:
  cache:
    key:
      files:
        - flake.lock
    paths:
      - .nix-cache
  before_script:
    - |
      if [ -d .nix-cache/store ]; then
        echo "Restoring Nix store from cache..."
        cp -rn .nix-cache/store/* /nix/store/ 2>/dev/null || true
        nix-store --load-db < .nix-cache/db.dump
      fi
  after_script:
    - |
      echo "Saving Nix store to cache..."
      mkdir -p .nix-cache/store
      cached_paths=$(nix path-info --derivation --recursive .#devShells.x86_64-linux.default 2>/dev/null || true)
      if [ -n "$cached_paths" ]; then
        echo "$cached_paths" | xargs -I{} cp -rn {} .nix-cache/store/ 2>/dev/null || true
        nix-store --dump-db $cached_paths > .nix-cache/db.dump
      fi

stages:
  - test
  - build
  - deploy
  - release

test:
  extends: .nix-cache
  stage: test
  script:
    - nix develop --command scripts/fetch-ci-gamefiles.sh
    - nix develop --command just test-all
  artifacts:
    when: always
    paths:
      - build/Testing/Temporary/LastTest.log
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED == "true"

docs-check:
  extends: .nix-cache
  stage: test
  script:
    - nix develop --command just build-docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  extends: .nix-cache
  stage: build
  script:
    - nix develop --command just package-debug "${CI_COMMIT_TAG:-dev}" "${CI_COMMIT_SHORT_SHA}"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-modding-*-debug.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED == "true"

build-release:
  extends: .nix-cache
  stage: build
  script:
    - nix develop --command just package-release "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}" "${PACKAGE_REGISTRY_URL}" "${CI_JOB_TOKEN}"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-*-release.zip
      - dttr-modding-*-debug.zip
      - dttr-modding-*-release.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

pages:
  extends: .nix-cache
  stage: deploy
  script:
    - nix develop --command just build-docs
  pages:
    publish: docs/build
  artifacts:
    paths:
      - docs/build
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - scripts/generate-release-notes.sh > changelog.md
  needs:
    - job: build-release
      artifacts: false
  release:
    tag_name: $CI_COMMIT_TAG
    description: ./changelog.md
    assets:
      links:
        - name: "dttr-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-release.zip"
          link_type: package
        - name: "dttr-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-modding-${CI_COMMIT_TAG}-release.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
