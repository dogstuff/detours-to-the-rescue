---
image: docker.io/nixos/nix:2.24.11

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  CI_IMAGE: "$CI_REGISTRY_IMAGE:main"
  CI_NIX_SHELL: ".#devShells.x86_64-linux.default"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dttr/${CI_COMMIT_TAG}"
  DTTR_REQUIRE_TEST_DEPS: "ON"
  DTTR_REQUIRE_PCDOGS_FIXTURES: "ON"
  DTTR_PCDOGS_FIXTURE_DIR: "gamefiles"
  DTTR_GAMEFILES_SECURE_FILE: "gamefiles.tar.gz"
  DTTR_USE_CACHED_SDL3GPU_SHADERS: "ON"

.ci-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

.ci-image-job:
  image: "$CI_IMAGE"

.build-job:
  extends:
    - .ci-image-job
    - .ci-rules
  stage: build
  needs:
    - job: "prepare:shaders"
      artifacts: true

.package-build-job:
  extends: .build-job

.upload-job:
  extends:
    - .ci-image-job
  stage: package

stages:
  - toolchain
  - prepare
  - build
  - test
  - package
  - deploy
  - release

"build:ci-image":
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  stage: toolchain
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    CACHE_IMAGE: "$CI_REGISTRY_IMAGE/cache:buildkit"
  before_script:
    - mkdir -p ~/.docker
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$CI_REGISTRY_USER" \
        "$CI_REGISTRY_PASSWORD" \
        > ~/.docker/config.json
  script:
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt filename=build.Containerfile
      --import-cache type=registry,ref="$CACHE_IMAGE"
      --export-cache type=registry,ref="$CACHE_IMAGE",mode=max
      --output type=image,\"name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA,$CI_REGISTRY_IMAGE:main\",push=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - build.Containerfile
        - flake.nix
        - flake.lock
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

"prepare:shaders":
  extends:
    - .ci-image-job
  stage: prepare
  script:
    - nix develop "$CI_NIX_SHELL" --command just ci-shader-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - modules/sidecar/shaders/cache/sdl3gpu/
    expire_in: 1 day

"build:ctest":
  extends: .build-job
  script:
    - nix develop "$CI_NIX_SHELL" --command just ci-build-ctest
  artifacts:
    paths:
      - build/
    expire_in: 1 day

"build:debug":
  extends: .package-build-job
  script:
    - >-
      nix develop "$CI_NIX_SHELL" --command
      just package-debug
      "${CI_COMMIT_TAG:-dev}"
      "${CI_COMMIT_REF_SLUG}"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-modding-*-debug.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

"build:release":
  extends: .package-build-job
  script:
    - nix develop "$CI_NIX_SHELL" --command just package-release "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-*-release.zip
      - dttr-modding-*-debug.zip
      - dttr-modding-*-release.zip
      - dttr-mod-template-c.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

"test:ctest":
  extends:
    - .ci-image-job
    - .ci-rules
  stage: test
  needs:
    - job: "build:ctest"
      artifacts: true
  script:
    - nix develop "$CI_NIX_SHELL" --command bash -lc 'scripts/fetch-ci-gamefiles.sh && just ci-test'
  artifacts:
    when: always
    paths:
      - build/Testing/Temporary/LastTest.log
    expire_in: 2 weeks

"test:docs":
  extends:
    - .ci-image-job
  stage: test
  needs:
    - job: "build:ctest"
      artifacts: true
  script:
    - nix develop "$CI_NIX_SHELL" --command just build-docs-from-build
  artifacts:
    paths:
      - docs/build
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_PROTECTED == "true"

"package:release":
  extends: .upload-job
  needs:
    - job: "build:release"
      artifacts: true
  script:
    - >-
      nix develop "$CI_NIX_SHELL" --command
      scripts/upload-package-artifacts.sh
      "${PACKAGE_REGISTRY_URL}"
      "${CI_JOB_TOKEN}"
      "dttr-${CI_COMMIT_TAG}-debug.zip"
      "dttr-${CI_COMMIT_TAG}-release.zip"
      "dttr-modding-${CI_COMMIT_TAG}-debug.zip"
      "dttr-modding-${CI_COMMIT_TAG}-release.zip"
      "dttr-mod-template-c.zip"
  artifacts:
    paths:
      - dttr-*-debug.zip
      - dttr-*-release.zip
      - dttr-modding-*-debug.zip
      - dttr-modding-*-release.zip
      - dttr-mod-template-c.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

.pages-deploy-job: &pages-deploy-job
  stage: deploy
  needs:
    - job: "test:docs"
      artifacts: true
  script:
    - test -d docs/build
  pages: &pages-settings
    publish: docs/build
    expire_in: never
  artifacts:
    paths:
      - docs/build

"deploy:pages:latest":
  <<: *pages-deploy-job
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$/'

"release:gitlab":
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - scripts/generate-release-notes.sh > changelog.md
  needs:
    - job: "package:release"
      artifacts: false
  release:
    tag_name: $CI_COMMIT_TAG
    description: ./changelog.md
    assets:
      links:
        - name: "dttr-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-release.zip"
          link_type: package
        - name: "dttr-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-release.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-release.zip"
          filepath: "/dttr-modding-release.zip"
          link_type: package
        - name: "dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          filepath: "/dttr-modding-${CI_COMMIT_TAG}-debug.zip"
          link_type: package
        - name: "dttr-mod-template-c.zip"
          url: "${PACKAGE_REGISTRY_URL}/dttr-mod-template-c.zip"
          filepath: "/dttr-mod-template-c.zip"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
