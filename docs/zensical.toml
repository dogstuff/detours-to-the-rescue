[project]
site_name = "102 Patches: Detours to the Rescue! (DttR)"
site_description = "Run the PC version of 102 Dalmatians: Puppies to the Rescue on modern machines with crash fixes, windowed mode, controller support, and modding tools."
site_author = "dogstuff"
site_url = "https://dttr.102.dog/"
copyright = "Copyright &copy; 2026 dogstuff"

docs_dir = "pages"
site_dir = "build"

repo_name = "dogstuff/detours-to-the-rescue"
repo_url = "https://gitlab.com/dogstuff/detours-to-the-rescue"
extra_css = ["assets/stylesheets/site.css"]
extra_javascript = [{ path = "assets/js/pcdogs-symbol-viewer.mjs", type = "module" }]
extra_templates = ["robots.txt"]
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = [
    { "Initial Setup" = "quick-start/00-initial-setup.md" },
    { "Configuration" = "quick-start/01-configuration.md" },
    { "Installing Mods" = "quick-start/02-installing-mods.md" },
    { "Troubleshooting" = "quick-start/03-troubleshooting.md" },
  ] },
  { "Modding SDK" = [
    { "Creating Mods in C" = [
      { "Project Setup" = "modding-sdk/00-project-setup.md" },
      { "Handling Mod Callbacks" = "modding-sdk/01-handling-mod-callbacks.md" },
      { "Working with Game Globals" = "modding-sdk/02-working-with-game-globals.md" },
      { "Calling Game Functions" = "modding-sdk/03-calling-game-functions.md" },
      { "Applying Game Patches" = "modding-sdk/04-applying-game-patches.md" },
      { "Hooking Game Functions" = "modding-sdk/05-hooking-game-functions.md" },
      { "Drawing a GUI" = "modding-sdk/06-drawing-a-gui.md" },
      { "Manually Resolving Symbols" = "modding-sdk/07-resolving-symbols.md" },
      { "Defining Custom Settings" = "modding-sdk/08-mod-config.md" },
    ] },
    { "PCDogs Symbols" = [
      { "PCDogs Symbols" = "modding-sdk/symbols/pcdogs/index.md" },
    ] },
    { "Symbols Manifest" = "modding-sdk/symbols/pcdogs/pcdogs.symbols.v1.json" },
    { "Symbols Manifest (Schema)" = "modding-sdk/symbols/pcdogs/pcdogs.symbols.schema.json" },
  ] },
  { "Technical Details" = [
    { "Configuration" = "technical-reference/00-configuration.md" },
    { "Patches" = "technical-reference/01-patches.md" },
    { "Compilation" = "technical-reference/02-compilation.md" },
    { "Internal Documentation" = "internal/" },
  ] },
  { "Vanilla (latest)" = "https://gitlab.com/dogstuff/detours-to-the-rescue/-/releases/permalink/latest/downloads/dttr-release.zip" },
  { "Modding (latest)" = "https://gitlab.com/dogstuff/detours-to-the-rescue/-/releases/permalink/latest/downloads/dttr-modding-release.zip" },
]

plugins = [
  { "search" = { "enabled" = true } },
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.prune",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.extra]
generator = false

[[project.theme.palette]]
scheme = "slate"


