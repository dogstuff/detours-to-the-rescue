[project]
site_name = "102 Patches: Detours to the Rescue!"
site_description = "Documentation for DttR, an alternate entrypoint for 102 Dalmatians: Puppies to the Rescue."
site_author = "dogstuff"
site_url = "https://dogstuff.gitlab.io/detours-to-the-rescue"
copyright = "Copyright &copy; 2026 dogstuff"

docs_dir = "pages"
site_dir = "build"

repo_name = "dogstuff/detours-to-the-rescue"
repo_url = "https://gitlab.com/dogstuff/detours-to-the-rescue"
extra_css = ["assets/stylesheets/site.css"]
nav = [
  { "Home" = "index.md" },
  { "Configuration" = "configuration.md" },
  { "Advanced" = [
    { "Modding SDK" = [
      { "Project Setup" = "modding/00-creating-a-mod.md" },
      { "Handling Mod Callbacks" = "modding/01-handling-events.md" },
      { "Working with Game Globals" = "modding/02-working-with-globals.md" },
      { "Calling Game Functions" = "modding/03-calling-pcdogs-functions.md" },
      { "Applying Game Patches" = "modding/04-applying-patches.md" },
      { "Hooking Game Functions" = "modding/05-hooking-functions.md" },
      { "Drawing a GUI" = "modding/07-imgui.md" },
      { "Manually Resolving Symbols" = "modding/08-resolving-symbols.md" },
      { "SDK API Reference" = "sdk-ref/" },
    ] },

    { "Technical Reference" = [
      { "Configuration" = "technical/configuration.md" },
      { "Patches" = "technical/patches.md" },
      { "Building" = "technical/building.md" },
      { "Internal API" = "internal/" },
    ] },
  ] },
]

plugins = [
  { "search" = { "enabled" = true } },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.extra]
generator = false

[[project.theme.palette]]
scheme = "slate"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
linenums_style = "pymdownx-inline"
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.tables]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
