PROJECT_NAME           = "102 Patches: Detours to the Rescue"
PROJECT_BRIEF          = "C reference for DttR maintainers and modders."
OUTPUT_DIRECTORY       = docs/build
HTML_OUTPUT            = internal
GENERATE_HTML          = YES
GENERATE_LATEX         = NO

INPUT                  = \
  modules \
  $(DTTR_SDK_GENERATED_INCLUDE_DIR)
FILE_PATTERNS          = *.c *.h
RECURSIVE              = YES

OPTIMIZE_OUTPUT_FOR_C  = YES
EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
TYPEDEF_HIDES_STRUCT   = NO

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = YES
PREDEFINED             = \
  __declspec(x)= \
  __cdecl= \
  __stdcall= \
  __thiscall= \
  __fastcall= \
  WINAPI= \
  APIENTRY= \
  CALLBACK= \
  DTTR_SDK_ENABLE_UNSTABLE

SOURCE_BROWSER         = YES
INLINE_SOURCES         = NO
SHOW_INCLUDE_FILES     = YES
SHOW_USED_FILES        = YES
REFERENCED_BY_RELATION = YES
REFERENCES_RELATION    = YES
SEARCHENGINE           = YES
HTML_EXTRA_STYLESHEET  = docs/doxygen/dttr-doxygen.css
WARN_LOGFILE           = docs/build/doxygen-warnings.log
