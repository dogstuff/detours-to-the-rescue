PROJECT_NAME           = "102 Patches: Detours to the Rescue"
PROJECT_BRIEF          = "Internal implementation reference for DttR maintainers."
OUTPUT_DIRECTORY       = docs/build
HTML_OUTPUT            = internal

INPUT                  = \
  modules/common \
  modules/loader \
  modules/sidecar
RECURSIVE              = YES

EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
GENERATE_LATEX         = NO
OPTIMIZE_OUTPUT_FOR_C  = YES

DISABLE_INDEX          = NO
GENERATE_TREEVIEW      = YES
FULL_SIDEBAR           = YES
TREEVIEW_WIDTH         = 320
PAGE_OUTLINE_PANEL     = YES
ALPHABETICAL_INDEX     = YES
SEARCHENGINE           = YES
SERVER_BASED_SEARCH    = NO
HTML_INDEX_NUM_ENTRIES = 60
HTML_DYNAMIC_SECTIONS  = YES
HTML_COPY_CLIPBOARD    = YES
SOURCE_BROWSER         = YES
INLINE_SOURCES         = NO
REFERENCED_BY_RELATION = YES
REFERENCES_RELATION    = YES
SHOW_INCLUDE_FILES     = YES
SHOW_USED_FILES        = YES
EXT_LINKS_IN_WINDOW    = NO
HTML_COLORSTYLE        = AUTO_LIGHT
HTML_COLORSTYLE_HUE    = 210
HTML_COLORSTYLE_SAT    = 42
HTML_COLORSTYLE_GAMMA  = 92
HTML_EXTRA_STYLESHEET  = docs/doxygen/dttr-doxygen.css
WARN_LOGFILE           = docs/build/doxygen-internal-warnings.log
