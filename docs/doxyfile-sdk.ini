PROJECT_NAME           = "DttR Modding SDK"
PROJECT_BRIEF          = "API documentation for the DttR modding SDK."
OUTPUT_DIRECTORY       = docs/build
HTML_OUTPUT            = sdk-ref
GENERATE_HTML          = YES
GENERATE_LATEX         = NO

INPUT                  = \
  modules/sdk/include/dttr_mods.h \
  modules/sdk/include/dttr_core.h \
  modules/sdk/include/dttr_runtime.h \
  $(DTTR_SDK_GENERATED_INCLUDE_DIR)/dttr_pcdogs.h \
  modules/sdk/include/dttr_util.h \
  $(DTTR_SDK_GENERATED_INCLUDE_DIR)/dttr_pcdogs_unstable.h \
  modules/sdk/include/dttr_util_unstable.h \
  modules/sdk/docs/groups.dox \
  modules/sdk/docs/pcdogs-groups.dox \
  modules/sdk/docs/mainpage.md

FILE_PATTERNS          = *.h *.md *.dox
RECURSIVE              = NO
USE_MDFILE_AS_MAINPAGE = modules/sdk/docs/mainpage.md
MARKDOWN_SUPPORT       = YES

OPTIMIZE_OUTPUT_FOR_C  = YES
TYPEDEF_HIDES_STRUCT   = NO
EXTRACT_ALL            = NO
EXTRACT_PRIVATE        = NO
EXTRACT_STATIC         = YES
HIDE_UNDOC_MEMBERS     = YES
HIDE_UNDOC_CLASSES     = YES
SKIP_FUNCTION_MACROS   = NO

FULL_PATH_NAMES        = YES
STRIP_FROM_PATH        = modules/sdk/include $(DTTR_SDK_GENERATED_INCLUDE_DIR) modules/sdk/docs
STRIP_FROM_INC_PATH    = modules/sdk/include $(DTTR_SDK_GENERATED_INCLUDE_DIR)
SORT_MEMBER_DOCS       = YES
SORT_BRIEF_DOCS        = YES
TOC_INCLUDE_HEADINGS   = 3

DISABLE_INDEX          = NO
GENERATE_TREEVIEW      = YES
FULL_SIDEBAR           = YES
TREEVIEW_WIDTH         = 320
PAGE_OUTLINE_PANEL     = YES
ALPHABETICAL_INDEX     = YES
SEARCHENGINE           = YES
SERVER_BASED_SEARCH    = NO
HTML_INDEX_NUM_ENTRIES = 60
HTML_DYNAMIC_SECTIONS  = YES
HTML_COPY_CLIPBOARD    = YES
HTML_DYNAMIC_MENUS     = YES
SOURCE_BROWSER         = YES
INLINE_SOURCES         = NO
REFERENCED_BY_RELATION = YES
REFERENCES_RELATION    = YES
SHOW_FILES             = YES
SHOW_INCLUDE_FILES     = NO
SHOW_USED_FILES        = NO
MAX_INITIALIZER_LINES  = 12
ENUM_VALUES_PER_LINE   = 1
EXT_LINKS_IN_WINDOW    = NO
HTML_COLORSTYLE        = AUTO_LIGHT
HTML_COLORSTYLE_HUE    = 210
HTML_COLORSTYLE_SAT    = 42
HTML_COLORSTYLE_GAMMA  = 92
HTML_EXTRA_STYLESHEET  = docs/doxygen/dttr-doxygen.css

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = YES
PREDEFINED             = \
  __declspec(x)= \
  __cdecl= \
  __stdcall= \
  __thiscall= \
  __fastcall= \
  WINAPI= \
  APIENTRY= \
  CALLBACK= \
  DTTR_SDK_ENABLE_UNSTABLE

WARN_IF_UNDOCUMENTED   = YES
WARN_IF_DOC_ERROR      = YES
WARN_IF_INCOMPLETE_DOC = YES
WARN_NO_PARAMDOC       = YES
WARN_AS_ERROR          = NO
WARN_LOGFILE           = docs/build/doxygen-sdk-warnings.log
